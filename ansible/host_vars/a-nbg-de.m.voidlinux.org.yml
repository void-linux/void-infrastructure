---
network_static_routes:
  - to: default
    via: 152.53.152.1
  - to: default
    via: fe80::1

network_static_interfaces:
  - name: eth0
    type: direct
    addrs:
      - 152.53.154.59/22
      - 2a00:11c0:47:331e::/64

sshd_AllowGroups:
  - build-ops

buildworker_archs:
  - x86_64

nomad_meta:
  builder: "true"

nomad_host_volumes:
  - name: x86_64-glibc_hostdir
    path: /hostdir
    read_only: false
  - name: x86_64-glibc_workdir
    path: /workdir
    read_only: false
  - name: x86_64-glibc_buildrootdir
    path: /buildroot
    read_only: false
  - name: ccache
    path: /hostdir/ccache
    read_only: true
