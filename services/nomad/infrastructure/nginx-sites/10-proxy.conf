{{ range nomadServices "?ns=*" -}}
{{ range nomadService (printf "%s?ns=%s" .Name .Namespace) -}}
{{ if in .Tags "nginx_enable" -}}
{{ range $tag := .Tags -}}
    {{ if $tag | contains "nginx_names=" -}}
        {{ scratch.Set "names" ($tag | trimPrefix "nginx_names=") -}}
        {{ break -}}
    {{ end -}}
{{ end -}}
server {
    include /etc/nginx/fragments/ssl.conf;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name {{ scratch.Get "names" }};

    location / {
        proxy_set_header Host $host;
        proxy_pass http://{{ .Address }}:{{ .Port }};
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
{{ end -}}
{{ end -}}
{{ end -}}
