---
# {{ $allocID := env "NOMAD_ALLOC_ID" }}
global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /local/alerts/*.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # {{ range nomadService "alertmanager?ns=monitoring" }}
          - '{{ .Address }}:{{ .Port }}'
          # {{ end }}
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
        - localhost:9090
  - job_name: node
    consul_sd_configs:
      - server: '{{ env "NOMAD_HOST_IP_http" }}:8500'
        datacenter: void
        services: ['node-exporter']
    relabel_configs:
      - source_labels: ['__meta_consul_node']
        target_label: instance
  # {{ range nomadService 1 $allocID "ssl-exporter?ns=monitoring" }}
  - job_name: 'ssl'
    metrics_path: /probe
    scrape_interval: 2m
    params:
      module: ["https"]
    static_configs:
      - targets:
          - build.voidlinux.org
          - docs.voidlinux.org
          - infradocs.voidlinux.org
          - repo-fi.voidlinux.org
          - repo-us.voidlinux.org
          - sources.voidlinux.org
          - terraform.voidlinux.org
          - voidlinux.org
          - www.voidlinux.org
          - xq-api.voidlinux.org
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: '{{ .Address }}:{{ .Port }}'
  - job_name: 'ssl-self-signed'
    metrics_path: /probe
    scrape_interval: 2m
    params:
      module: ["tcp_insecure"]
    static_configs:
      - targets:
        - netauth.voidlinux.org:1729
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: '{{ .Address }}:{{ .Port }}'
  # {{ end }}
  # {{ range $svc := nomadService 1 $allocID "repo-exporter?ns=monitoring" }}
  # {{ range $arch := "x86_64,x86_64-musl,i686,aarch64,aarch64-musl,armv7l,armv7l-musl,armv6l,armv6l-musl" | split "," }}
  #   {{ $path := "" }}
  #   {{ if $arch | regexMatch "^aarch64.*$" }}
  #     {{ $path = "/aarch64" }}
  #   {{ else if $arch | regexMatch "^.*-musl$" }}
  #     {{ $path = "/musl" }}
  #   {{ end }}
  - job_name: 'sync-{{ $arch }}'
    metrics_path: /probe
    scrape_interval: 2m
    params:
      arch: ['{{ $arch }}']
    static_configs:
      - targets:
          # {{ range nomadService 1 $allocID "root-pkgs-internal?ns=build" }}
          - '{{ .Address }}:{{ .Port }}/{{ $path }}'
          # {{ end }}
          - 'repo-default.voidlinux.org/current{{ $path }}'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_arch]
        target_label: arch
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: '{{ $svc.Address }}:{{ $svc.Port }}'
      - target_label: zone
        replacement: internal
  # {{ end }}
  - job_name: 'mirror-sync'
    metrics_path: /probe
    scrape_interval: 2m
    params:
      arch: [x86_64]
    http_sd_configs:
      - url: https://xmirror.voidlinux.org/metrics/prometheus.json
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_arch]
        target_label: arch
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "{{ $svc.Address }}:{{ $svc.Port }}"
      - target_label: zone
        replacement: external
  # {{ end }}
  # discover metrics from nomad services with the 'prometheus_enable' tag
  # use the 'prometheus_path=...' tag to change the url path to scrape metrics from (default: '/metrics')
  # use the 'prometheus_job=...' tag to change the name of the job in prometheus (default: service name)
  - job_name: nomad_sd
    nomad_sd_configs:
      # all namespaces
      # {{ range "apps,apps-restricted,build,infrastructure,mirror,monitoring" | split "," }}
      - server: 'http://{{ env "attr.unique.network.ip-address" }}:4646'
        namespace: '{{ . }}'
      # {{ end }}
    relabel_configs:
      # keep only services with the 'prometheus_enable=true' tag
      - source_labels: ['__meta_nomad_tags']
        regex: '.*,prometheus_enable,.*'
        action: keep
      # change the metrics url path
      - source_labels: ['__meta_nomad_tags']
        regex: '.*,prometheus_path=(.*),.*'
        replacement: '$1'
        target_label: '__metrics_path__'
      # set default job name to nomad service name
      - source_labels: ['__meta_nomad_service']
        target_label: job
      # override job name via tag
      - source_labels: ['__meta_nomad_tags']
        regex: '.*,prometheus_job=(.*),.*'
        target_label: job
      # get namespace from nomad
      - source_labels: ['__meta_nomad_namespace']
        target_label: namespace
      # get datacenter from nomad
      - source_labels: ['__meta_nomad_dc']
        target_label: datacenter
